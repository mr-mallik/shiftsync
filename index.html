<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO -->
    <title>ShiftSync | Smart Routine Manager</title>
    <meta name="description" content="ShiftSync helps you manage your rotating shift schedules and daily routines efficiently. Visualize your work-life balance." />
    <meta name="keywords" content="shift work, routine manager, calendar, schedule, productivity, warehouse shift" />
    <meta name="author" content="ShiftSync" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="ShiftSync | Smart Routine Manager" />
    <meta property="og:description" content="Manage your rotating shift schedules and daily routines efficiently." />
    <meta property="og:type" content="website" />
    
    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="text-gray-100 min-h-screen p-4 sm:p-8 selection:bg-blue-500 selection:text-white">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 animate-fade-in">
            <div>
                <h1 class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500 mb-2">
                    ShiftSync
                </h1>
                <p class="text-gray-400 text-sm md:text-base">Master your rotating schedule</p>
            </div>
            <div class="mt-4 md:mt-0">
                <h2 id="current-month" class="text-2xl font-light text-white/80"></h2>
            </div>
        </header>

        <!-- Main Content -->
        <main class="grid lg:grid-cols-12 gap-8">
            
            <!-- Calendar Section -->
            <section class="lg:col-span-7">
                <div class="glass-panel p-6 rounded-2xl">
                    <div id="calendar" class="grid grid-cols-7 gap-3">
                        <!-- Calendar generated by JS -->
                    </div>
                </div>
            </section>

            <!-- Schedule Display Section -->
            <section class="lg:col-span-5">
                <div id="schedule" class="glass-panel p-6 rounded-2xl hidden sticky top-8">
                    <h2 id="schedule-title" class="text-xl font-bold mb-6 flex items-center flex-wrap gap-2">
                        <!-- Title generated by JS -->
                    </h2>
                    <div id="schedule-body" class="space-y-3">
                        <!-- Schedule items generated by JS -->
                    </div>
                </div>
                
                <!-- Placeholder when no date selected -->
                <div id="schedule-placeholder" class="glass-panel p-8 rounded-2xl text-center text-gray-500 h-full flex flex-col justify-center items-center border-dashed border-2 border-gray-700/50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <p>Select a date to view your routine</p>
                </div>
            </section>

        </main>
        
        <footer class="mt-12 text-center text-gray-600 text-sm">
            <p>&copy; 2025 ShiftSync. All rights reserved.</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="assets/js/app.js"></script>
    <script>
        // Simple toggle for placeholder
        document.getElementById('calendar').addEventListener('click', (e) => {
            if(e.target.closest('.calendar-day')) {
                document.getElementById('schedule-placeholder').classList.add('hidden');
            }
        });
    </script>

</body>
</html>
